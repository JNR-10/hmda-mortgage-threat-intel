[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mortgage-threat-intel"
version = "0.1.0"
description = "Offline HMDA proxy study for privacy, fairness, explainability, and robustness (not DU)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — course project" }
authors = [
  { name = "Jainil Rana" },
  { name = "Krati Jain" },
]
dependencies = [
  "numpy>=1.26,<2",  # torch 2.2.x wheels expect NumPy 1.x
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "PyYAML>=6.0,<7",
  "pydantic>=2.5,<3",
  # macOS x86_64 PyPI currently tops out at torch 2.2.x; Opacus>=1.5 needs nn.RMSNorm (torch>=2.4).
  "torch>=2.2,<2.3",
  "opacus>=1.4,<1.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
mortgage-threat-intel = "mortgage_threat_intel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
